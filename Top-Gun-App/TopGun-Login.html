<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Top Gun Soccer App</title>

    <link rel="stylesheet" href="CSS/TopGun-style.css">
    <link rel="stylesheet" href="CSS/TopGun-auth.css">
</head>
<body class="auth-page-body">

    <main class="auth-page-container">
        <section class="auth-card" aria-labelledby="loginHeading">
            <div class="auth-brand-icon" aria-hidden="true">⚽</div>

            <p class="auth-page-label">Top Gun Soccer App</p>
            <h1 id="loginHeading">Welcome Back</h1>
            <p class="auth-introduction">
                Log in to open your team dashboard.
            </p>

            <form id="loginForm" class="auth-form">
                <div class="auth-field">
                    <label for="loginEmail">Email</label>
                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="auth-field">
                    <label for="loginPassword">Password</label>
                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" id="loginBtn">Log In</button>

                <button
                    type="button"
                    id="forgotPasswordBtn"
                    class="secondary-button auth-forgot-button"
                >
                    Forgot Password?
                </button>
            </form>

            <p id="message" class="auth-message" role="status" aria-live="polite"></p>

            <div class="auth-page-switch">
                <span>Need an account?</span>
                <a href="TopGun-Index.html">Create an account</a>
            </div>
        </section>
    </main>

    <script type="module" src="JS/TopGun-auth.js"></script>
</body>
</html>
