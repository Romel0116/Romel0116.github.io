<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Top Gun Soccer App</title>

    <link rel="stylesheet" href="CSS/TopGun-style.css">
    <link rel="stylesheet" href="CSS/TopGun-auth.css">
</head>
<body class="auth-page-body">

    <main class="auth-page-container">
        <section class="auth-card" aria-labelledby="createAccountHeading">
            <div class="auth-brand-icon" aria-hidden="true">⚽</div>

            <p class="auth-page-label">Top Gun Soccer App</p>
            <h1 id="createAccountHeading">Create Account</h1>
            <p class="auth-introduction">
                Create your account to join or manage your soccer team.
            </p>

            <form id="registerForm" class="auth-form">
                <div class="auth-field">
                    <label for="registerName">Full Name</label>
                    <input
                        type="text"
                        id="registerName"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        maxlength="80"
                        required
                    >
                </div>

                <div class="auth-field">
                    <label for="registerEmail">Email</label>
                    <input
                        type="email"
                        id="registerEmail"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="auth-field">
                    <label for="registerPassword">Password</label>
                    <input
                        type="password"
                        id="registerPassword"
                        name="password"
                        placeholder="At least 6 characters"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >
                    <small>Use at least 6 characters.</small>
                </div>

                <button type="submit" id="registerBtn">
                    Create Account
                </button>
            </form>

            <p id="message" class="auth-message" role="status" aria-live="polite"></p>

            <div class="auth-page-switch">
                <span>Already have an account?</span>
                <a href="TopGun-Login.html">Log in here</a>
            </div>
        </section>
    </main>

    <script type="module" src="JS/TopGun-auth.js"></script>
</body>
</html>
