<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Top Gun Team Chat</title>

    <link
        rel="stylesheet"
        href="CSS/TopGun-style.css"
    >
</head>

<body class="chat-page-body">

    <main class="modern-chat-container">

        <header class="modern-chat-header">

            <div class="chat-header-identity">

                <div class="chat-header-icon" aria-hidden="true">
                    💬
                </div>

                <div>
                    <p class="chat-section-label">
                        Team Chat
                    </p>

                    <h1 id="chatTeamName">
                        Loading team...
                    </h1>

                    <p id="chatMemberStatus" class="chat-status">
                        Checking your membership...
                    </p>
                </div>

            </div>

            <div class="chat-header-actions">

                <a
                    id="backToTeamFromChat"
                    class="chat-back-button"
                    href="TopGun-Dashboard.html"
                >
                    ← Back to Team
                </a>

                <button
                    type="button"
                    id="chatLogoutBtn"
                    class="chat-logout-button"
                >
                    Logout
                </button>

            </div>

        </header>

        <section class="modern-chat-panel">

            <div class="chat-date-divider">
                <span>Team conversation</span>
            </div>

            <div
                id="chatMessages"
                class="modern-chat-messages"
                aria-live="polite"
            >
                <p class="chat-empty-message">
                    Loading messages...
                </p>
            </div>

            <div class="modern-chat-composer">

                <label
                    for="chatMessageInput"
                    class="visually-hidden"
                >
                    Type a message
                </label>

                <div class="chat-input-wrapper">

                    <span class="chat-input-icon" aria-hidden="true">
                        💬
                    </span>

                    <textarea
                        id="chatMessageInput"
                        placeholder="Type a message..."
                        maxlength="1000"
                        rows="1"
                    ></textarea>

                </div>

                <button
                    type="button"
                    id="sendMessageBtn"
                    class="chat-send-button"
                >
                    <span aria-hidden="true">➤</span>
                    Send
                </button>

            </div>

            <p class="chat-keyboard-help">
                Press Enter to send · Shift + Enter for a new line
            </p>

        </section>

        <p id="chatPageMessage" class="chat-page-feedback"></p>

    </main>

    <script
        type="module"
        src="JS/TopGun-chat.js"
    ></script>

</body>
</html>
