<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Top Gun Dashboard</title>

    <link rel="stylesheet" href="CSS/TopGun-style.css">
    <link rel="stylesheet" href="CSS/TopGun-admin.css">
</head>
<body>

    <main class="dashboard-container">

        <header class="dashboard-header">
            <div>
                <h1>Top Gun Soccer App</h1>
                <p id="welcomeMessage">Loading your account...</p>
                <span id="dashboardRoleBadge" class="admin-role-badge" hidden>
                    Team Admin
                </span>
            </div>

            <button id="logoutBtn" class="logout-button">
                Logout
            </button>
        </header>

        <section
            id="adminToolsCard"
            class="dashboard-card dashboard-admin-tools"
            hidden
        >
            <div class="admin-tools-heading">
                <div>
                    <p class="team-page-label">Private Admin Area</p>
                    <h2>Team Admin Tools</h2>
                    <p>Organization-wide tools visible only to Team Admins.</p>
                </div>

                <span class="admin-role-badge">Team Admin Only</span>
            </div>

            <div class="admin-dashboard-grid">
                <button
                    type="button"
                    id="openExpenseSheetBtn"
                    class="admin-tool-card"
                >
                    <span class="feature-icon" aria-hidden="true">🧾</span>
                    <strong>Expense Sheet</strong>
                    <span>Track and export organization expenses</span>
                </button>
            </div>
        </section>

        <section class="dashboard-card">
            <h2 id="teamsHeading">My Teams</h2>

            <p id="teamsIntroduction">
                Create a team, join with an invite code, or open one of your teams.
            </p>

            <div class="team-form">
    <label for="teamName">Team Name</label>

    <input
        type="text"
        id="teamName"
        placeholder="Example: Top Gun FC"
        maxlength="60"
    >

    <button id="createTeamBtn">
        Create Team
    </button>
</div>

<div class="join-team-form">
    <h3>Join a Team</h3>

    <label for="teamInviteCode">
        Invite Code
    </label>

    <input
        type="text"
        id="teamInviteCode"
        placeholder="Example: TG-ABC123"
        maxlength="9"
        autocomplete="off"
    >

    <button
        type="button"
        id="joinTeamBtn"
        class="secondary-button"
    >
        Join Team
    </button>
</div>

<div id="teamsList">
    <p>Loading your teams...</p>
</div>
        </section>

        <p id="dashboardMessage"></p>

    </main>

    <script
        type="module"
        src="JS/TopGun-dashboard.js">
    </script>

</body>
</html>
