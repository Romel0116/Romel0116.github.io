<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Gun Scores</title>
    <link rel="stylesheet" href="CSS/TopGun-style.css">
    <link rel="stylesheet" href="CSS/TopGun-standings.css">
</head>
<body class="standings-page-body">
<main class="team-page-container">
    <header class="team-page-header">
        <div>
            <p class="team-page-label">League Scores</p>
            <h1 id="scoresTeam">Scores</h1>
            <p id="scoresStatus" role="status">Checking your membership...</p>
        </div>
        <div class="team-header-actions">
            <a id="scoresBack" class="dashboard-link" href="TopGun-Dashboard.html">Back to Team</a>
        </div>
    </header>
    <section class="team-summary-card" id="scoresContent" aria-labelledby="scoresHeading" hidden>
        <h2 id="scoresHeading">Final Scores</h2>
        <p id="scoresUpdated"></p>
        <p><a id="scoresSource" target="_blank" rel="noopener noreferrer">View official TeamSideline results</a></p>
        <form id="scoresFilters" class="score-filters" aria-label="Filter final scores">
            <div class="score-filter-field">
                <label for="scoresFilter">Team</label>
                <select id="scoresFilter">
                    <option value="team">My team</option>
                    <option value="division">All division games</option>
                </select>
            </div>
            <div class="score-filter-field">
                <label for="scoresStage">Stage</label>
                <select id="scoresStage">
                    <option value="all">All stages</option>
                    <option value="regular">Regular season</option>
                    <option value="playoffs">Playoffs</option>
                </select>
            </div>
            <div class="score-filter-field">
                <label for="scoresFrom">From date</label>
                <input id="scoresFrom" type="date">
            </div>
            <div class="score-filter-field">
                <label for="scoresThrough">Through date</label>
                <input id="scoresThrough" type="date">
            </div>
            <div class="score-filter-field">
                <label for="scoresSort">Sort by</label>
                <select id="scoresSort">
                    <option value="newest">Newest first</option>
                    <option value="oldest">Oldest first</option>
                </select>
            </div>
            <button type="button" id="scoresReset" class="score-filters-reset">Reset filters</button>
        </form>
        <p id="scoresCount" role="status"></p>
        <div id="scoresList"></div>
    </section>
</main>
<script type="module" src="JS/TopGun-scores.js"></script>
</body>
</html>
